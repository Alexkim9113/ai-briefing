  # PHASE M.5E-4 -- Transition Admission Gate + Verified Evidence Admission for the TRANSITION
  # pilot above. Unlike every other admission job, this one does NOT call
  # admission_gate.admit_shadow_result() directly on the raw shadow result -- it runs
