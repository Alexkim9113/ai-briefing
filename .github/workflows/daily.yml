name: 매일 AI 브리핑

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 수집(정각은 GitHub 서버가 붐벼 7분·37분에 실행)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능
    inputs:
      since:
        description: "지난 글 다시 모으기 시작 날짜(YYYY-MM-DD). 비우면 평소처럼 수집"
        required: false
        default: ""
      until:
        description: "지난 글 다시 모으기 마지막 날짜(YYYY-MM-DD, 비우면 어제까지)"
        required: false
        default: ""
      only:
        description: "지난 글 다시 모을 소스 이름·분야(예: 법률)"
        required: false
        default: ""
      limit:
        description: "지난 글 다시 모으기: 소스별 하루 최대 개수"
        required: false
        default: ""
      photos:
        description: "무료(CC0) 표지 사진 지금 모으기 (yes 입력)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["briefing.py", "intro.html", "sources.json", "static/**", "posts/**", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기 중에 다른 실행이 데이터를 올렸을 수 있으니 실행 시점의 최신 main을 받는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 무료(CC0) 표지 사진 자동 수집(하루 한 번, 새벽 4시)
        env:
          PHOTOS: ${{ inputs.photos }}
        run: |
          if [ "$PHOTOS" = "yes" ] || { [ "$(TZ=Asia/Seoul date +%H)" = "04" ] && [ "$(date +%M)" -lt 30 ]; }; then
            sudo apt-get install -y -qq tesseract-ocr >/dev/null; pip install -q pillow && python briefing.py photos || echo "사진 수집 실패(다음 날 다시 시도)"
          fi
      - name: 운영자 글 열쇠 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .editor
          key: editor-${{ github.run_id }}
          restore-keys: editor-
      - name: 운영자 글·기사 삭제 요청 받기(에디터 자동 작업이 멈춰도 30분마다 처리)
        run: |
          pip install -q cryptography && python briefing.py inbox || echo "요청 받기 실패(다음 실행에서 다시)"
      - name: 운영자 글 열쇠 보관
        uses: actions/cache/save@v4
        with:
          path: .editor
          key: editor-${{ github.run_id }}
      - name: 수집 + 사이트 생성
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          MS_TRANSLATOR_KEY: ${{ secrets.MS_TRANSLATOR_KEY }}
          MS_TRANSLATOR_REGION: ${{ secrets.MS_TRANSLATOR_REGION }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          # CLOSURE ROUND C 근본원인: 이 step이 trafilatura를 설치한 적이 없어
          # content_acquisition._TRAFILATURA_AVAILABLE가 항상 False였다 - source-intel-fetch-pilot.yml은
          # 이미 설치하고 있었고(그래서 그 워크플로에서는 real fetch가 정상 성공했다), 이 daily 경로만
          # 빠져 있었다. 페이지 내용과 무관하게 모든 fetch가 EXTRACTION_TOO_SHORT로 귀결된 원인.
          pip install -q trafilatura
          if [ -n "$SINCE" ]; then python briefing.py backfill --since "$SINCE" ${UNTIL:+--until "$UNTIL"} ${ONLY:+--only "$ONLY"} ${LIMIT:+--limit "$LIMIT"} && python briefing.py build; else python briefing.py; fi
      - name: 수집 데이터 저장(카테고리 아카이브 보관용)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static/photos posts static/editor-key.json
          git diff --cached --quiet || git commit -m "브리핑 데이터 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main   # 겹치면 이번 실행의 데이터를 우선
          done
      - name: 사이트 게시(gh-pages 브랜치)
        run: |
          git pull -q --rebase -X theirs origin main || true   # 그 사이 올라온 에디터 글까지 받아서
          python briefing.py build                             # 다시 만든다(에디터 글이 사라지지 않게)
          # N-5 Public Intelligence Page -- briefing.py를 전혀 수정하지 않는 독립 빌드 스텝
          # (n5_public_integration_decision.json 참고). site/는 이미 build()가 만든 뒤이고,
          # 실패해도 사이트 게시 자체는 절대 막지 않는다(fail-soft).
          python intel/report_engine/public_delivery.py site/ || echo "[intelligence] 생성 건너뜀(비치명적)"
          # N-5 Operator Workspace(PUBLIC_SAFE_OPERATOR -- GitHub Pages는 인증이 없으므로
          # 민감 데이터를 전혀 쓰지 않는 inspection 전용 뷰만 생성한다). 동일하게 fail-soft.
          python intel/operator_workspace/operator_ui.py site/ || echo "[operator] 생성 건너뜀(비치명적)"
          cd site
          git init -q -b gh-pages
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "사이트 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

  # PRODUCTION EVIDENCE SUPPLY v1.0 SUBSTEP G/H(운영자 승인 2026-09-29). Evidence Pipeline을
  # 완전히 분리된 job으로 SHADOW 실행한다 — build job과 독립된 concurrency group을 써서
  # build가 실패하거나 늦어져도 이 job이 그것 때문에 막히지 않고, 반대로 이 job이 실패해도
  # (shadow_runner.py는 절대 exit 1로 끝나지 않지만, checkout/push 등 워크플로 자체 단계가
  # 실패할 가능성까지 대비해 continue-on-error도 같이 건다) build/사이트 게시에는 전혀 영향이
  # 없다(섹션 20: COLLECTION SUCCESS + PUBLIC SITE SUCCESS + EVIDENCE PIPELINE FAILURE 동시
  # 가능해야 함). 이 job은 intel/ 아래 결과 파일만 커밋한다 — briefing.py/site/데이터 수집
  # 파일은 전혀 건드리지 않는다.
  evidence_shadow:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: evidence-shadow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # build job이 방금 올린 최신 documents.json/evidence_pipeline 상태를 받는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evidence Pipeline Shadow 실행(REPORTS_ON + Claim/Evidence/Gemini L3 라우팅)
        continue-on-error: true   # 이 단계가 실패해도 job 자체는 계속 진행(커밋 단계까지 도달)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python3 intel/evidence_supply/shadow_runner.py
      - name: Evidence 결과 저장(intel/ 만, Public Site와 완전히 분리)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/
          git diff --cached --quiet || git commit -m "Evidence Pipeline Shadow 실행 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          # M.5F SECTION 37: bumped 3->8 retries, same fix as reality_shadow/
          # evidence_admission_real_historical/evidence_admission_real_counterevidence below.
          # Audited and reproduced: this job either runs in true parallel with the other
          # needs:build-only shadow jobs, or starts while an earlier job in its own needs chain
          # is still mid-push -- the same 6-jobs-within-15-seconds contention reality_shadow's
          # fix comment documents (run 36736359463). 3 retries can exhaust silently (the step
          # still exits 0, since the loop's last command was a successful rebase, not the failed
          # push); loop body itself unchanged, no shared/commonized script.
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main
          done

  # PHASE M.3 — Reality & Indicator Intelligence Layer pilot. Same isolation pattern as
  # evidence_shadow above: own concurrency group, continue-on-error, needs build, if: always(),
  # commits only its own new output file (reality_pilot_result.json) under
  # intel/foresight_engine/ - never touches Public Site/data/site or any other intel/ dir. This
  # job's real result (live reachability of World Bank / ECOS from GitHub Actions' real
  # network) is only observable once this actually runs on a real cron tick - it was not
  # fabricated in the authoring session, which confirmed the sandbox itself blocks all four
  # tested official-source hosts (World Bank, KOSIS, ECOS, OECD SDMX) at the outbound proxy.
  reality_shadow:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: reality-shadow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reality Indicator Pilot 실행 (World Bank / ECOS 실제 연결 시도)
        continue-on-error: true
        run: python3 intel/foresight_engine/scripts/fetch_reality_indicators.py
      - name: Reality Pilot 결과 저장 (foresight_engine/reality_pilot_result.json 만)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/foresight_engine/reality_pilot_result.json
          git diff --cached --quiet || git commit -m "Reality Indicator Pilot 실행 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          # PHASE M.5E-4: bumped 3->8 retries. Discovered live (run 36736359463) that under heavy
          # contention -- this run had 6 shadow jobs all committing to main within ~15 seconds
          # right after build -- 3 attempts can exhaust without ever landing a successful push,
          # silently discarding the commit (the job step still exits 0 because the loop's last
          # command was a successful rebase, not the failed push). More retries only ever helps
          # here; the loop body itself is unchanged.
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main
          done

  # PHASE M.5C — Verified Evidence Admission Gate. Runs AFTER federal_register_shadow commits
  # its shadow result, and is the ONLY job (and admission_gate.admit_shadow_result() the ONLY
  # function) allowed to write intel/documents.json for acquired evidence. Reads
  # intel/historical_acquisition/federal_register_pilot_result.json (never the raw fetcher
  # output directly) and re-validates every canonicalized candidate against the 10 admission
  # checks (FETCH_OK/PARSE_OK/VALIDATION_OK/CANONICAL_URL_VALID/SOURCE_IDENTIFIED/
  # SOURCE_TYPE_IDENTIFIED/PUBLICATION_DATE_VALID/PROVENANCE_PRESENT/IDENTITY_RESOLVED/
  # COPYRIGHT_POLICY_RESOLVED) before admitting anything. Idempotent by construction: a
  # document already in documents.json with an unchanged content_hash is DUPLICATE_EXISTING,
  # never re-admitted or duplicated -- this is what the operator will verify by triggering this
  # workflow twice in a row. Own concurrency group + continue-on-error on the admission step +
  # if: always(), same isolation discipline as every other shadow/acquisition job above; this
  # job commits documents.json plus its own intel/evidence_admission/*.json provenance/audit
  # sidecars, and nothing else.
  evidence_admission:
    needs: [build, federal_register_shadow]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: evidence-admission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verified Evidence Admission Gate 실행 (federal_register_pilot_result.json → documents.json)
        continue-on-error: true
        run: python3 intel/evidence_admission/run_admission.py
      - name: Admission 결과 저장 (documents.json + evidence_admission 산출물만)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/documents.json intel/evidence_admission/admission_provenance.json intel/evidence_admission/admission_audit_log.json
          git diff --cached --quiet || git commit -m "Verified Evidence Admission Gate 실행 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          # M.5F SECTION 37: bumped 3->8 retries, same fix as reality_shadow/
          # evidence_admission_real_historical/evidence_admission_real_counterevidence below.
          # Audited and reproduced: this job either runs in true parallel with the other
          # needs:build-only shadow jobs, or starts while an earlier job in its own needs chain
          # is still mid-push -- the same 6-jobs-within-15-seconds contention reality_shadow's
          # fix comment documents (run 36736359463). 3 retries can exhaust silently (the step
          # still exits 0, since the loop's last command was a successful rebase, not the failed
          # push); loop body itself unchanged, no shared/commonized script.
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main
          done

  # PHASE M.5B — Historical Acquisition pilot #1: US Federal Register API (real, free,
  # no-key official source; targets the MISSING_REGULATORY_HISTORY gap type from
  # intel/historical_acquisition/gap_source_map.py). Same isolation pattern as evidence_shadow
  # / reality_shadow above: own concurrency group, continue-on-error, needs build, if:
  # always(), commits only its own new output file
  # (intel/historical_acquisition/federal_register_pilot_result.json) -- never touches
  # intel/documents.json or any file the core collection pipeline owns. This job's real
  # result (live reachability of federalregister.gov from GitHub Actions' network) is only
  # observable once this actually runs on a real cron tick -- the authoring sandbox confirmed
  # this exact host is blocked at its own outbound proxy (403), and that fact is not
  # fabricated as a GitHub Actions result here.
  federal_register_shadow:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: federal-register-shadow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Federal Register Historical Acquisition Pilot 실행 (실제 연결 시도)
        continue-on-error: true
        run: python3 intel/historical_acquisition/fetch_federal_register.py
      - name: Federal Register Pilot 결과 저장 (historical_acquisition/federal_register_pilot_result.json 만)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/historical_acquisition/federal_register_pilot_result.json
          git diff --cached --quiet || git commit -m "Federal Register Historical Acquisition Pilot 실행 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          # M.5F SECTION 37: bumped 3->8 retries, same fix as reality_shadow/
          # evidence_admission_real_historical/evidence_admission_real_counterevidence below.
          # Audited and reproduced: this job either runs in true parallel with the other
          # needs:build-only shadow jobs, or starts while an earlier job in its own needs chain
          # is still mid-push -- the same 6-jobs-within-15-seconds contention reality_shadow's
          # fix comment documents (run 36736359463). 3 retries can exhaust silently (the step
          # still exits 0, since the loop's last command was a successful rebase, not the failed
          # push); loop body itself unchanged, no shared/commonized script.
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main
          done

  # PHASE M.5D -- Crossref academic-evidence pilot (real, free, no-key REST API; targets the
  # MISSING_ACADEMIC_EVIDENCE gap type). Same isolation pattern as federal_register_shadow:
  # own concurrency group, continue-on-error, needs build, if: always(), commits only its own
  # new output file (intel/historical_acquisition/crossref_pilot_result.json) -- never touches
  # documents.json. Live reachability of api.crossref.org from GitHub Actions' network is only
  # observable once this actually runs; this sandbox confirmed the host is blocked at its own
  # outbound proxy, and that fact is not fabricated as a GitHub Actions result here.
  crossref_shadow:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: crossref-shadow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crossref Academic Evidence Pilot 실행 (실제 연결 시도)
        continue-on-error: true
        run: python3 intel/historical_acquisition/fetch_crossref.py
      - name: Crossref Pilot 결과 저장 (historical_acquisition/crossref_pilot_result.json 만)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/historical_acquisition/crossref_pilot_result.json
          git diff --cached --quiet || git commit -m "Crossref Academic Evidence Pilot 실행 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          # M.5F SECTION 37: bumped 3->8 retries, same fix as reality_shadow/
          # evidence_admission_real_historical/evidence_admission_real_counterevidence below.
          # Audited and reproduced: this job either runs in true parallel with the other
          # needs:build-only shadow jobs, or starts while an earlier job in its own needs chain
          # is still mid-push -- the same 6-jobs-within-15-seconds contention reality_shadow's
          # fix comment documents (run 36736359463). 3 retries can exhaust silently (the step
          # still exits 0, since the loop's last command was a successful rebase, not the failed
          # push); loop body itself unchanged, no shared/commonized script.
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main
          done

  # PHASE M.5D -- Verified Evidence Admission Gate for Crossref. Mirrors evidence_admission
  # exactly (same admission_gate.admit_shadow_result(), same 10 checks, same idempotency
  # guarantee) but reads crossref_pilot_result.json instead of the Federal Register shadow
  # file. Runs AFTER crossref_shadow commits its result.
  evidence_admission_crossref:
    # Depends on evidence_admission too (not just crossref_shadow) so the two admission jobs
    # never write documents.json concurrently -- avoids a documents.json merge race between
    # two shadow sources admitting in the same run.
    needs: [build, crossref_shadow, evidence_admission]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: evidence-admission-crossref
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verified Evidence Admission Gate 실행 (crossref_pilot_result.json → documents.json)
        continue-on-error: true
        run: python3 intel/evidence_admission/run_admission_crossref.py
      - name: Admission 결과 저장 (documents.json + evidence_admission 산출물만)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/documents.json intel/evidence_admission/admission_provenance.json intel/evidence_admission/admission_audit_log.json
          git diff --cached --quiet || git commit -m "Verified Evidence Admission Gate (Crossref) 실행 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          # M.5F SECTION 37: bumped 3->8 retries, same fix as reality_shadow/
          # evidence_admission_real_historical/evidence_admission_real_counterevidence below.
          # Audited and reproduced: this job either runs in true parallel with the other
          # needs:build-only shadow jobs, or starts while an earlier job in its own needs chain
          # is still mid-push -- the same 6-jobs-within-15-seconds contention reality_shadow's
          # fix comment documents (run 36736359463). 3 retries can exhaust silently (the step
          # still exits 0, since the loop's last command was a successful rebase, not the failed
          # push); loop body itself unchanged, no shared/commonized script.
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main
          done

  # PHASE M.5E -- Federal Register HISTORICAL date-range pilot (targets INSUFFICIENT_TIME_DEPTH,
  # the corpus's most severe proven gap: 577 documents span only 8 days). Reuses
  # fetch_federal_register.py's hardened fetch/validate/canonicalize pipeline unchanged; only the
  # query differs (explicit older date window, order=oldest). Same isolation pattern as the other
  # shadow jobs: own concurrency group, continue-on-error, needs build, if: always(), commits only
  # its own new output file -- never touches documents.json. Live reachability/behavior of the
  # date-range query is only observable once this actually runs; not fabricated here.
  federal_register_historical_shadow:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: federal-register-historical-shadow
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Federal Register Historical Window Pilot 실행 (실제 연결 시도, INSUFFICIENT_TIME_DEPTH)
        continue-on-error: true
        run: python3 intel/historical_acquisition/fetch_federal_register_historical.py
      - name: Historical Pilot 결과 저장 (historical_acquisition/federal_register_historical_pilot_result.json 만)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/historical_acquisition/federal_register_historical_pilot_result.json
          git diff --cached --quiet || git commit -m "Federal Register Historical Window Pilot 실행 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          # M.5F SECTION 37: bumped 3->8 retries, same fix as reality_shadow/
          # evidence_admission_real_historical/evidence_admission_real_counterevidence below.
          # Audited and reproduced: this job either runs in true parallel with the other
          # needs:build-only shadow jobs, or starts while an earlier job in its own needs chain
