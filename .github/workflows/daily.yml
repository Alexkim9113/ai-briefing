name: 매일 AI 브리핑

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국시간 오전 6시 (UTC 21:00)
    - cron: "0 9 * * *"    # 매일 한국시간 오후 6시에 한 번 더 보충 수집
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths: ["briefing.py", "sources.json", ".github/workflows/daily.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 + 사이트 생성
        run: python briefing.py
      - name: 수집 데이터 저장(지난 브리핑 보관용)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "브리핑 데이터 $(TZ=Asia/Seoul date +%F)"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
