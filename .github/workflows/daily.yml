  # PHASE N-7 Section 8-13 -- Live Acquisition Execution Environment Shift. The sandbox this repo
  # is developed in has org-policy egress blocks (confirmed repeatedly: World Bank/EIA/Crossref/
  # Federal Register/ILO/RISS all return proxy "Tunnel connection failed: 403 Forbidden"), so real
  # HTTP acquisition for Source Health + Policy Research + Counterevidence + Longitudinal Evidence
  # happens here, in the real GitHub Actions network, instead of being repeated against the sandbox.
  # Reuses the EXISTING modules as-is (source_health_model.py, policy_research_acquisition.py,
