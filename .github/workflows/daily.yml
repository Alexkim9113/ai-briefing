name: 매일 AI 브리핑

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 수집(정각은 GitHub 서버가 붐벼 7분·37분에 실행)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]
    paths: ["briefing.py", "sources.json", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 + 사이트 생성
        run: python briefing.py
      - name: 수집 데이터 저장(지난 브리핑 보관용)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "브리핑 데이터 $(TZ=Asia/Seoul date +%F)"
          git push || (git pull --rebase && git push)
      - name: 사이트 게시(gh-pages 브랜치)
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "사이트 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
