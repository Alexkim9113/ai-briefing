  # Depends on every other admission job so no two admission jobs ever write documents.json
  # concurrently in the same run -- same race-avoidance reasoning as the other admission jobs.
  evidence_admission_transition_energy:
    needs: [build, transition_evidence_energy_shadow, evidence_admission, evidence_admission_crossref, evidence_admission_fedreg_historical]
    if: always()
    runs-on: ubuntu-latest
