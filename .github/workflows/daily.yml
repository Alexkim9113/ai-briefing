  # existing Admission jobs above, which already run for real). Fail-soft per script
  # (continue-on-error) so one blocked/slow source never fails the whole job.
  n7_live_acquisition:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: n7-live-acquisition
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source Health 실사 점검 (GitHub Actions 실네트워크, environment=GITHUB_ACTIONS 태깅)
        continue-on-error: true
        run: python3 intel/source_health/source_health_model.py
      - name: Policy Research 실사 수집 시도 (등록된 소스만, URL 추측 금지)
