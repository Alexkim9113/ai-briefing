name: 매일 AI 브리핑

on:
  schedule:
    - cron: "7,37 * * * *"   # 30분마다 수집(정각은 GitHub 서버가 붐벼 7분·37분에 실행)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능
    inputs:
      since:
        description: "지난 글 다시 모으기 시작 날짜(YYYY-MM-DD). 비우면 평소처럼 수집"
        required: false
        default: ""
      until:
        description: "지난 글 다시 모으기 마지막 날짜(YYYY-MM-DD, 비우면 어제까지)"
        required: false
        default: ""
      only:
        description: "지난 글 다시 모을 소스 이름·분야(예: 법률)"
        required: false
        default: ""
      limit:
        description: "지난 글 다시 모으기: 소스별 하루 최대 개수"
        required: false
        default: ""
      photos:
        description: "무료(CC0) 표지 사진 지금 모으기 (yes 입력)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["briefing.py", "intro.html", "sources.json", "static/**", "posts/**", ".github/workflows/daily.yml"]

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 대기 중에 다른 실행이 데이터를 올렸을 수 있으니 실행 시점의 최신 main을 받는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 무료(CC0) 표지 사진 자동 수집(하루 한 번, 새벽 4시)
        env:
          PHOTOS: ${{ inputs.photos }}
        run: |
          if [ "$PHOTOS" = "yes" ] || { [ "$(TZ=Asia/Seoul date +%H)" = "04" ] && [ "$(date +%M)" -lt 30 ]; }; then
            sudo apt-get install -y -qq tesseract-ocr >/dev/null; pip install -q pillow && python briefing.py photos || echo "사진 수집 실패(다음 날 다시 시도)"
          fi
      - name: 운영자 글 열쇠 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .editor
          key: editor-${{ github.run_id }}
          restore-keys: editor-
      - name: 운영자 글·기사 삭제 요청 받기(에디터 자동 작업이 멈춰도 30분마다 처리)
        run: |
          pip install -q cryptography && python briefing.py inbox || echo "요청 받기 실패(다음 실행에서 다시)"
      - name: 운영자 글 열쇠 보관
        uses: actions/cache/save@v4
        with:
          path: .editor
          key: editor-${{ github.run_id }}
      - name: 수집 + 사이트 생성
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          MS_TRANSLATOR_KEY: ${{ secrets.MS_TRANSLATOR_KEY }}
          MS_TRANSLATOR_REGION: ${{ secrets.MS_TRANSLATOR_REGION }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          if [ -n "$SINCE" ]; then python briefing.py backfill --since "$SINCE" ${UNTIL:+--until "$UNTIL"} ${ONLY:+--only "$ONLY"} ${LIMIT:+--limit "$LIMIT"} && python briefing.py build; else python briefing.py; fi
      - name: 수집 데이터 저장(카테고리 아카이브 보관용)
        run: |
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static/photos posts static/editor-key.json
          git diff --cached --quiet || git commit -m "브리핑 데이터 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main   # 겹치면 이번 실행의 데이터를 우선
          done
      - name: 사이트 게시(gh-pages 브랜치)
        run: |
          git pull -q --rebase -X theirs origin main || true   # 그 사이 올라온 에디터 글까지 받아서
          python briefing.py build                             # 다시 만든다(에디터 글이 사라지지 않게)
          cd site
          git init -q -b gh-pages
          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "사이트 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
