          git config user.name "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intel/source_health/source_health_result.github_actions.json \
                  intel/evidence_network/policy_research_acquisition_result.github_actions.json \
                  intel/evidence_network/counterevidence_live_acquisition_result.github_actions.json \
                  intel/evidence_network/longitudinal_evidence_acquisition_result.github_actions.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "N7: GitHub Actions 실네트워크 Live Acquisition 결과 $(TZ=Asia/Seoul date +%F' '%H:%M)"
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git fetch origin main && git rebase -X theirs origin/main
          done
