name: 임시 언론사 RSS 확인
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["probe_feeds.py"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe_feeds.py
