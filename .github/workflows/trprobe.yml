name: 번역 품질 시험(임시)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          k=os.environ["DEEPL_KEY"]; host="api-free.deepl.com" if k.endswith(":fx") else "api.deepl.com"
          T=["Nvidia's 2026 Dividend Hike Puts Dividend Growth Stocks in the Spotlight",
             "Why letting Claude clean your TV's bloatware isn't the best idea",
             "Gemini app replacing Gems with skills in November",
             "OpenAI is reportedly raising money at a $500B valuation"]
          def call(extra):
              d=[("target_lang","KO")]+[("text",t) for t in T]+extra
              r=urllib.request.Request(f"https://{host}/v2/translate",urllib.parse.urlencode(d).encode(),{"Authorization":"DeepL-Auth-Key "+k})
              try:
                  j=json.load(urllib.request.urlopen(r,timeout=30));return [x["text"] for x in j["translations"]]
              except urllib.error.HTTPError as e: return f"HTTP {e.code} {e.read()[:200]}"
          for name,extra in [("기본",[]),("quality",[("model_type","prefer_quality_optimized")]),
                             ("context",[("context","AI 기술 뉴스 기사 제목. 한국 언론 헤드라인처럼 간결하게.")]),
                             ("both",[("model_type","prefer_quality_optimized"),("context","AI 기술 뉴스 기사 제목. 한국 언론 헤드라인처럼 간결하게.")])]:
              print("==",name); print(json.dumps(call(extra),ensure_ascii=False,indent=0))
          r=urllib.request.Request(f"https://{host}/v2/usage",headers={"Authorization":"DeepL-Auth-Key "+k})
          print(urllib.request.urlopen(r).read().decode())
          PY
