name: AI 요약 시험(임시)
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"한 문장으로 인사해"}]}'
          echo "== models.github.ai"; curl -sS -i -m 60 https://models.github.ai/inference/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -d "$B" | head -c 1500; echo
          echo "== catalog"; curl -sS -m 60 https://models.github.ai/catalog/models -H "Authorization: Bearer $GITHUB_TOKEN" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(m.get('id'),m.get('rate_limit_tier')) for m in d[:60]]" || true
          echo "== azure endpoint"; curl -sS -i -m 60 https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"한 문장으로 인사해"}]}' | head -c 1500; echo
