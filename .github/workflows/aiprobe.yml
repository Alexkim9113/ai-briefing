name: AI 요약 시험(임시)
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, glob
          d = json.load(open(sorted(glob.glob("data/*.json"))[-1]))
          items = [i for i in d["items"] if i.get("summary")][:3]
          inp = [{"id": i["id"], "category": i["category"], "source": i["source"], "title": i["title"], "description": i.get("summary", "")} for i in items]
          sysmsg = "너는 METAXIS의 AI 브리핑 에디터다. 각 항목마다 QUICK_BRIEF(2~3문장), METAXIS_POINT(2문장), TAGS(3~5개)를 한국어로 쓴다. JSON 배열만 출력: [{\"id\":..., \"brief\":..., \"point\":..., \"tags\":[...]}]"
          for model in ["openai/gpt-4.1-mini", "openai/gpt-4o-mini", "openai/gpt-4.1"]:
              body = json.dumps({"model": model, "temperature": 0.3, "messages": [{"role": "system", "content": sysmsg}, {"role": "user", "content": json.dumps(inp, ensure_ascii=False)}]}).encode()
              r = urllib.request.Request("https://models.github.ai/inference/chat/completions", body,
                  {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Content-Type": "application/json", "Accept": "application/json"})
              try:
                  resp = urllib.request.urlopen(r, timeout=90)
                  print("==", model, resp.status, {k: v for k, v in resp.headers.items() if "limit" in k.lower() or "remaining" in k.lower()})
                  j = json.load(resp); print(j["choices"][0]["message"]["content"][:1500]); print("usage", j.get("usage"))
              except urllib.error.HTTPError as e:
                  print("==", model, "HTTP", e.code, dict(e.headers), e.read()[:400])
          PY
